  /v1/proof-obligation-coverage-dossiers:
    get:
      summary: List Proof Obligation Coverage Dossiers
      operationId: list_proof_obligation_coverage_dossiers_v1_proof_obligation_coverage_dossiers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProofObligationCoverageDossier'
                type: array
                title: Response List Proof Obligation Coverage Dossiers V1 Proof Obligation
                  Coverage Dossiers Get
    post:
      summary: Create Proof Obligation Coverage Dossier
      operationId: create_proof_obligation_coverage_dossier_v1_proof_obligation_coverage_dossiers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofObligationCoverageDossierCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofObligationCoverageDossier'
        '422':
