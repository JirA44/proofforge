          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InconsistencyAnalysis'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/inconsistency-analyses/{analysis_id}:
    get:
      summary: Get Inconsistency Analysis
      operationId: get_inconsistency_analysis_v1_inconsistency_analyses__analysis_id__get
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InconsistencyAnalysis'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/proof-dependency-dossiers:
