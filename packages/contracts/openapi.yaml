              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/proof-dependency-dossiers/{dossier_id}:
    get:
      summary: Get Proof Dependency Dossier
      operationId: get_proof_dependency_dossier_v1_proof_dependency_dossiers__dossier_id__get
