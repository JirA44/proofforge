  /v1/proof-obligation-coverage-dossiers/{dossier_id}:
    get:
      summary: Get Proof Obligation Coverage Dossier
      operationId: get_proof_obligation_coverage_dossier_v1_proof_obligation_coverage_dossiers__dossier_id__get
