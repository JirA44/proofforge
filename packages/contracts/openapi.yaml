  /v1/proof-stability-dossiers:
    get:
      summary: List Proof Stability Dossiers
      operationId: list_proof_stability_dossiers_v1_proof_stability_dossiers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProofStabilityDossier'
                type: array
                title: Response List Proof Stability Dossiers V1 Proof Stability Dossiers
                  Get
    post:
      summary: Create Proof Stability Dossier
      operationId: create_proof_stability_dossier_v1_proof_stability_dossiers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofStabilityDossierCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofStabilityDossier'
        '422':
