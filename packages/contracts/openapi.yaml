openapi: 3.1.0
info:
  title: ProofForge API
  description: Propositions, arguments, cohérence, stabilité et couverture d'obligations
    de preuves immuables avec vérification machine déterministe.
  version: 1.0.7
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /info:
    get:
      summary: Info
      operationId: info_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/propositions:
    get:
      summary: List Propositions
      operationId: list_propositions_v1_propositions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Proposition'
                type: array
                title: Response List Propositions V1 Propositions Get
    post:
      summary: Create Proposition
      operationId: create_proposition_v1_propositions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropositionCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposition'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/verifications:
    post:
      summary: Create Verification
      operationId: create_verification_v1_verifications_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/arguments:
    get:
      summary: List Arguments
      operationId: list_arguments_v1_arguments_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Argument'
                type: array
                title: Response List Arguments V1 Arguments Get
    post:
      summary: Create Argument
      operationId: create_argument_v1_arguments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArgumentCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Argument'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/entailments:
    post:
      summary: Check Entailment
      operationId: check_entailment_v1_entailments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntailmentCheckCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntailmentCheck'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/formula-comparisons:
    get:
      summary: List Formula Comparisons
      operationId: list_formula_comparisons_v1_formula_comparisons_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FormulaComparison'
                type: array
                title: Response List Formula Comparisons V1 Formula Comparisons Get
    post:
      summary: Compare Formulae
      operationId: compare_formulae_v1_formula_comparisons_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormulaComparisonCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaComparison'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/formula-comparisons/{comparison_id}:
    get:
      summary: Get Formula Comparison
      operationId: get_formula_comparison_v1_formula_comparisons__comparison_id__get
      parameters:
      - name: comparison_id
        in: path
        required: true
        schema:
          type: string
          title: Comparison Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaComparison'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/premise-sets:
    get:
      summary: List Premise Sets
      operationId: list_premise_sets_v1_premise_sets_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
