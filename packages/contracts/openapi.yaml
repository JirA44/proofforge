components:
  schemas:
    Argument:
      properties:
        id:
          type: string
          title: Id
        argument_hash:
          type: string
          title: Argument Hash
        specification:
          $ref: '#/components/schemas/ArgumentCreate'
        immutable:
          type: boolean
          title: Immutable
          default: true
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - id
      - argument_hash
      - specification
      - created_at
      title: Argument
    ArgumentCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        premises:
          items:
            type: string
          type: array
          maxItems: 32
          minItems: 1
          title: Premises
        conclusion:
          type: string
          maxLength: 1000
          minLength: 1
          title: Conclusion
        variables:
          items:
            type: string
          type: array
          maxItems: 8
          minItems: 1
          title: Variables
        language:
          type: string
          pattern: ^propositional-v1$
          title: Language
          default: propositional-v1
      additionalProperties: false
      type: object
      required:
      - name
      - premises
      - conclusion
      - variables
      title: ArgumentCreate
    CoherenceNecessityWitness:
      properties:
        entailment_ids:
          items:
            type: string
          type: array
          title: Entailment Ids
        conclusion:
          type: string
          title: Conclusion
        valuation:
          anyOf:
          - additionalProperties:
              type: boolean
            type: object
          - type: 'null'
          title: Valuation
      type: object
      required:
      - entailment_ids
      - conclusion
      - valuation
      title: CoherenceNecessityWitness
    CoherenceProof:
      properties:
        entailment_id:
          type: string
          title: Entailment Id
        argument_id:
          type: string
          title: Argument Id
        conclusion:
          type: string
          title: Conclusion
        variables:
          items:
            type: string
          type: array
          title: Variables
        verdict:
          type: string
          title: Verdict
        verification_valid:
          type: boolean
          title: Verification Valid
        argument_hash:
          type: string
          title: Argument Hash
        entailment_hash:
          type: string
          title: Entailment Hash
      type: object
      required:
      - entailment_id
      - argument_id
      - conclusion
      - variables
      - verdict
      - verification_valid
      - argument_hash
      - entailment_hash
      title: CoherenceProof
    ContradictionWitness:
      properties:
        kind:
          type: string
          enum:
          - LOGICAL_NEGATION_OR_INCOMPATIBILITY
          - JOINT_IMPOSSIBILITY
          title: Kind
        entailment_ids:
          items:
            type: string
          type: array
          title: Entailment Ids
        conclusions:
          items:
            type: string
          type: array
          title: Conclusions
        necessity_witnesses:
          items:
            $ref: '#/components/schemas/CoherenceNecessityWitness'
          type: array
          title: Necessity Witnesses
      type: object
      required:
      - kind
      - entailment_ids
      - conclusions
      - necessity_witnesses
      title: ContradictionWitness
    EntailmentCheck:
      properties:
        id:
          type: string
          title: Id
        argument_id:
          type: string
          title: Argument Id
        method:
          type: string
          title: Method
        verdict:
          type: string
          enum:
          - ENTAILED
          - NOT_ENTAILED
          - INCONSISTENT_PREMISES
          title: Verdict
        valuations_checked:
          type: integer
          title: Valuations Checked
        premise_models:
          type: integer
          title: Premise Models
        counterexample:
          anyOf:
          - additionalProperties:
              type: boolean
            type: object
          - type: 'null'
          title: Counterexample
        entailment_hash:
          type: string
          title: Entailment Hash
        reproducible:
          type: boolean
          title: Reproducible
          default: true
        idempotent_replay:
          type: boolean
          title: Idempotent Replay
          default: false
        immutable:
          type: boolean
          title: Immutable
          default: true
        created_at:
          type: string
          title: Created At
        warning:
          type: string
          title: Warning
          default: Entaillement limité au langage formel déclaré ; il ne valide ni
            les prémisses dans le monde réel ni une vérité empirique.
      type: object
      required:
      - id
      - argument_id
      - method
      - verdict
      - valuations_checked
      - premise_models
      - entailment_hash
      - created_at
      title: EntailmentCheck
    EntailmentCheckCreate:
      properties:
        argument_id:
          type: string
          minLength: 1
          title: Argument Id
        method:
          type: string
          const: truth-table-entailment-v1
          title: Method
          default: truth-table-entailment-v1
      additionalProperties: false
      type: object
      required:
      - argument_id
      title: EntailmentCheckCreate
    FormulaComparison:
      properties:
        id:
          type: string
          title: Id
        input_hash:
          type: string
          title: Input Hash
        specification:
          $ref: '#/components/schemas/FormulaComparisonCreate'
        verdict:
          type: string
          enum:
          - EQUIVALENT
          - NOT_EQUIVALENT
          title: Verdict
        valuations_checked:
          type: integer
          title: Valuations Checked
        counterexample:
          anyOf:
          - $ref: '#/components/schemas/FormulaCounterexample'
          - type: 'null'
        comparison_hash:
          type: string
          title: Comparison Hash
        reproducible:
          type: boolean
          title: Reproducible
          default: true
        idempotent_replay:
          type: boolean
          title: Idempotent Replay
          default: false
        immutable:
          type: boolean
          title: Immutable
          default: true
        created_at:
          type: string
          title: Created At
        warning:
          type: string
          title: Warning
          default: Équivalence limitée au langage formel déclaré ; elle ne démontre
            aucune équivalence empirique entre les phénomènes éventuellement représentés.
      type: object
      required:
      - id
      - input_hash
      - specification
      - verdict
      - valuations_checked
      - comparison_hash
      - created_at
      title: FormulaComparison
    FormulaComparisonCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        left_expression:
          type: string
          maxLength: 1000
          minLength: 1
          title: Left Expression
        right_expression:
          type: string
          maxLength: 1000
          minLength: 1
          title: Right Expression
        variables:
          items:
            type: string
          type: array
          maxItems: 8
          minItems: 1
          title: Variables
        method:
          type: string
          const: truth-table-equivalence-v1
          title: Method
          default: truth-table-equivalence-v1
      additionalProperties: false
      type: object
      required:
      - name
      - left_expression
      - right_expression
      - variables
      title: FormulaComparisonCreate
    FormulaCounterexample:
      properties:
        valuation:
          additionalProperties:
            type: boolean
          type: object
          title: Valuation
        left_value:
          type: boolean
          title: Left Value
        right_value:
          type: boolean
          title: Right Value
      type: object
      required:
      - valuation
      - left_value
      - right_value
      title: FormulaCounterexample
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InconsistencyAnalysis:
      properties:
        id:
          type: string
          title: Id
        premise_set_id:
          type: string
          title: Premise Set Id
        method:
          type: string
          title: Method
        verdict:
          type: string
          enum:
          - CONSISTENT
          - INCONSISTENT
          title: Verdict
        valuations_checked:
          type: integer
          title: Valuations Checked
        satisfying_assignment:
          anyOf:
          - additionalProperties:
              type: boolean
            type: object
          - type: 'null'
          title: Satisfying Assignment
        core_indices:
          items:
            type: integer
          type: array
          title: Core Indices
        minimal_core:
          items:
            type: string
          type: array
          title: Minimal Core
        necessity_witnesses:
          items:
            $ref: '#/components/schemas/NecessityWitness'
          type: array
          title: Necessity Witnesses
        minimality_verified:
          type: boolean
          title: Minimality Verified
        analysis_hash:
          type: string
          title: Analysis Hash
        reproducible:
          type: boolean
          title: Reproducible
          default: true
        immutable:
          type: boolean
          title: Immutable
          default: true
        idempotent_replay:
          type: boolean
          title: Idempotent Replay
          default: false
        created_at:
          type: string
          title: Created At
        warning:
          type: string
          title: Warning
          default: 'Cohérence limitée au calcul propositionnel déclaré : le noyau
            est minimal par inclusion, pas nécessairement de cardinalité minimale,
            et ne juge aucune vérité empirique.'
      type: object
      required:
      - id
      - premise_set_id
      - method
      - verdict
      - valuations_checked
      - core_indices
      - minimal_core
      - necessity_witnesses
      - minimality_verified
      - analysis_hash
      - created_at
      title: InconsistencyAnalysis
    InconsistencyAnalysisCreate:
      properties:
        premise_set_id:
          type: string
          minLength: 1
          title: Premise Set Id
        method:
          type: string
          const: truth-table-minimal-unsat-core-v1
          title: Method
          default: truth-table-minimal-unsat-core-v1
      additionalProperties: false
      type: object
      required:
      - premise_set_id
      title: InconsistencyAnalysisCreate
    MultiArgumentCoherenceCreate:
      properties:
        entailment_ids:
          items:
            type: string
          type: array
          maxItems: 50
          minItems: 2
          title: Entailment Ids
        method:
          type: string
          const: truth-table-multi-conclusion-coherence-v1
          title: Method
          default: truth-table-multi-conclusion-coherence-v1
      additionalProperties: false
      type: object
      required:
      - entailment_ids
      title: MultiArgumentCoherenceCreate
    MultiArgumentCoherenceDossier:
      properties:
        id:
          type: string
          title: Id
