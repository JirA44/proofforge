                type: array
                title: Response List Premise Sets V1 Premise Sets Get
    post:
      summary: Create Premise Set
      operationId: create_premise_set_v1_premise_sets_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PremiseSetCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiseSet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/inconsistency-analyses:
    post:
      summary: Analyze Inconsistency
      operationId: analyze_inconsistency_v1_inconsistency_analyses_post
      requestBody:
