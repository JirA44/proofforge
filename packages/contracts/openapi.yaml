                $ref: '#/components/schemas/ProofDependencyDossier'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/multi-argument-coherence-dossiers:
    get:
      summary: List Multi Argument Coherence Dossiers
      operationId: list_multi_argument_coherence_dossiers_v1_multi_argument_coherence_dossiers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MultiArgumentCoherenceDossier'
                type: array
                title: Response List Multi Argument Coherence Dossiers V1 Multi Argument
                  Coherence Dossiers Get
    post:
      summary: Create Multi Argument Coherence Dossier
      operationId: create_multi_argument_coherence_dossier_v1_multi_argument_coherence_dossiers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiArgumentCoherenceCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiArgumentCoherenceDossier'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/multi-argument-coherence-dossiers/{dossier_id}:
    get:
      summary: Get Multi Argument Coherence Dossier
      operationId: get_multi_argument_coherence_dossier_v1_multi_argument_coherence_dossiers__dossier_id__get
      parameters:
      - name: dossier_id
        in: path
        required: true
