name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q apps tests
      - name: Validate exact static/runtime OpenAPI contract
        shell: python
        run: |
          import yaml
          from apps.api.main import app
          with open("packages/contracts/openapi.yaml", encoding="utf-8") as stream:
              static = yaml.safe_load(stream)
          assert static["openapi"] == "3.1.0"
          assert static["info"]["version"] == "1.0.7"
          assert static == app.openapi()
